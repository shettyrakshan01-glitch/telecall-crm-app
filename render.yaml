services:
  - type: web
    name: telecall-crm
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python backend/seed.py && uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
