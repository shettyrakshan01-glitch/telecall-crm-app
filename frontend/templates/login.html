<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script>
    // Instant Auto-Restore Session Guard: If already logged in, redirect straight to dashboard
    (function() {
      try {
        const token = localStorage.getItem('crm_access_token') || sessionStorage.getItem('crm_access_token') || (document.cookie.match(/(?:^|;\s*)access_token=([^;]+)/) || [])[1];
        let role = null;
        const userStr = localStorage.getItem('crm_user') || sessionStorage.getItem('crm_user');
        if (userStr) {
          try { role = JSON.parse(userStr).role; } catch(e){}
        }
        if (!role && token && token.includes('.')) {
          try {
            const payload = JSON.parse(atob(token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')));
            role = payload.role;
          } catch(e){}
        }
        if (token && role) {
          if (role === 'admin' || role === 'manager') {
            window.location.replace('/admin');
          } else if (role === 'telecaller') {
            window.location.replace('/workspace');
          } else if (role === 'super_admin') {
            window.location.replace('/superadmin');
          }
        }
      } catch(e) {}
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Telecalling CRM</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <meta name="apple-mobile-web-app-capable" content="yes">

    /* Suppress any AppsGeyser promo / ad widgets */
    [id*="appsgeyser"], [class*="appsgeyser"], [id*="download_app"], [class*="download_app"], .tt_download_bar_background {
      display: none !important;
      visibility: hidden !important;
      height: 0 !important;
      pointer-events: none !important;
    }
  </style>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/static/sw.js').catch(() => {});
      });
    }
  </script>
</head>

          >

            placeholder="••••••••"

          <option value="vikram@apex.com">Vikram Singh (vikram@apex.com)</option>
          <option value="pooja@apex.com">Pooja Nair (pooja@apex.com)</option>

  <script src="/static/js/app.js?v=1.2.4"></script>
  <script>
    lucide.createIcons();

    let currentMode = 'tenant';

    function switchLoginType(mode) {
      currentMode = mode;
      const tabTenant = document.getElementById('tab-tenant');
      const tabSuper = document.getElementById('tab-super');
      const subWrap = document.getElementById('subdomain-wrapper');

      if (mode === 'tenant') {
        tabTenant.className = 'flex-1 pb-2 text-center text-sm font-semibold border-b-2 border-blue-500 text-blue-400';
        tabSuper.className = 'flex-1 pb-2 text-center text-sm font-semibold border-b-2 border-transparent text-slate-400 hover:text-slate-200';
        subWrap.classList.remove('hidden');
      } else {
        tabSuper.className = 'flex-1 pb-2 text-center text-sm font-semibold border-b-2 border-purple-500 text-purple-400';
        tabTenant.className = 'flex-1 pb-2 text-center text-sm font-semibold border-b-2 border-transparent text-slate-400 hover:text-slate-200';
        subWrap.classList.add('hidden');
      }
    }

    function fillDemo(email, subdomain, mode) {
      switchLoginType(mode);
      document.getElementById('email').value = email;
      document.getElementById('password').value = 'Password@123';
      if (mode === 'tenant') {
        document.getElementById('subdomain').value = subdomain;
      }
    }

    async function handleLoginSubmit(e) {
      e.preventDefault();
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.innerHTML = `<span>Signing In...</span>`;

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const subdomain = currentMode === 'tenant' ? document.getElementById('subdomain').value.trim() : null;

      try {
        const data = await apiRequest('/auth/login', {
          method: 'POST',
          body: JSON.stringify({ email, password, subdomain })
        });

        setToken(data.access_token);
        setUser({
          id: data.user_id,
          email: data.email,
          full_name: data.full_name,
          role: data.role,
          company_id: data.company_id,
          company_name: data.company_name
        });
        // Redundant cookie & sessionStorage backup so app reload or call return never drops session
        try {
          document.cookie = "access_token=" + data.access_token + "; path=/; max-age=604800; SameSite=Lax";
          sessionStorage.setItem('crm_access_token', data.access_token);
          sessionStorage.setItem('crm_user', JSON.stringify({
            id: data.user_id,
            email: data.email,
            full_name: data.full_name,
            role: data.role,
            company_id: data.company_id,
            company_name: data.company_name
          }));
        } catch(e) {}

        showToast(`Welcome back, ${data.full_name}!`, 'success');

        // Redirect based on role
        setTimeout(() => {
          if (data.role === 'super_admin') {
            window.location.href = '/superadmin';
          } else if (data.role === 'admin' || data.role === 'manager') {
            window.location.href = '/admin';
          } else {
            window.location.href = '/workspace';
          }
        }, 500);

      } catch (err) {
        showToast(err.message || 'Login failed. Check your credentials.', 'error');
        submitBtn.disabled = false;
        submitBtn.innerHTML = `<span>Sign In</span> <i data-lucide="arrow-right" class="w-4 h-4"></i>`;
        lucide.createIcons();
      }
    }
  
    function checkMobileWebUser() {
      // Check if user is in standalone PWA, Webview, AppsGeyser, or WebIntoApp
      const isStandalone = window.matchMedia('(display-mode: standalone)').matches 
        || window.navigator.standalone 
        || /Android.*Version\/[\d.]+|wv|AppsGeyser|WebIntoApp/i.test(navigator.userAgent);
      
      const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
      const dismissed = sessionStorage.getItem('dismiss_web_banner');

      // Show ONLY if mobile web browser AND NOT inside the installed app!
      if (isMobile && !isStandalone && !dismissed) {
        const b = document.getElementById('mobile-web-banner');
        if (b) {
          b.classList.remove('hidden');
          lucide.createIcons();
        }
      }
    }

    function dismissMobileWebBanner() {
      sessionStorage.setItem('dismiss_web_banner', '1');
      const b = document.getElementById('mobile-web-banner');
      if (b) b.classList.add('hidden');
    }

    
    // Remove any AppsGeyser promo / "Download the App" injected badges
    function cleanInjectedBadges() {
      try {
        const all = document.querySelectorAll('*');
        for (let i = 0; i < all.length; i++) {
          const el = all[i];
          if (el.children.length === 0 && el.innerText && el.innerText.trim().toLowerCase() === 'download the app') {
            let node = el;
            while (node && node.parentElement && node.parentElement !== document.body && !node.id.includes('login') && !node.id.includes('form')) {
              node = node.parentElement;
            }
            if (node) {
              node.style.display = 'none';
              node.remove();
            }
          }
          if (el.id && (el.id.includes('appsgeyser') || el.id.includes('download_app') || el.id.includes('action_bar'))) {
            el.style.display = 'none';
            el.remove();
          }
        }
      } catch (e) {}
    }
    setInterval(cleanInjectedBadges, 300);

    window.addEventListener('DOMContentLoaded', checkMobileWebUser);
</script>
</body>
</html>
